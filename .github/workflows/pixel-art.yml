name: "🎨 Pixel art tool"

on:
  push:
    paths:
      - "tools/pixel-art/**"
      - ".github/workflows/pixel-art.yml"
      - "resources/famicube-palette.png"

env:
  JAVA_DISTRIBUTION: zulu
  JAVA_VERSION: 21

concurrency:
  group: "pixel-art"
  cancel-in-progress: false

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - { uses: actions/checkout@v4 }
      - { name: Set up JDK, uses: actions/setup-java@v3, with: { distribution: "${{ env.JAVA_DISTRIBUTION }}", java-version: "${{ env.JAVA_VERSION }}" } }
      - { name: Prepare Gradle, uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 } # v3.1.0
      - { name: Test and lint, run: ./gradlew -p tools/pixel-art test lintKotlin }
