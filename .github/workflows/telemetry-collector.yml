# Tests the telemetry collector, the Cloudflare Worker keeping the product events, and deploys it from main. See
# telemetry-collector/README.md
name: "📡 Telemetry collector"

on:
  push:
    branches: [ "main" ]
    paths:
      - "telemetry-collector/**"
      - "src/commonMain/kotlin/com/mkz/rpg/telemetry/adapters/storage/**"
      - "src/jvmTest/fixtures/telemetry/**"
      - ".github/workflows/telemetry-collector.yml"
  workflow_dispatch:

env:
  NODE_VERSION: 22

concurrency:
  group: "telemetry-collector"
  cancel-in-progress: false

defaults:
  run:
    working-directory: telemetry-collector

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v4 }
      - { name: Set up Node, uses: actions/setup-node@v4, with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: telemetry-collector/package-lock.json } }
      - { name: Install, run: npm ci }
      - { name: Generate the binding types, run: npm run types }
      - { name: Typecheck, run: npm run typecheck }
      - { name: Test, run: npm test }

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - { uses: actions/checkout@v4 }
      - { name: Set up Node, uses: actions/setup-node@v4, with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: telemetry-collector/package-lock.json } }
      - { name: Install, run: npm ci }
      - { name: Apply the migrations to D1, run: npx wrangler d1 migrations apply rpg-telemetry --remote }
      - { name: Deploy 🚀 the Worker, run: npx wrangler deploy }
